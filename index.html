<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="audio/chaahat.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Button -->
    <button id="musicBtn" onclick="toggleMusic()">
        🎵 Music
    </button>

    <!-- Background Stars -->
    <div class="stars"></div>


    <!-- ========================= -->
    <!-- WELCOME / OPENING SCREEN -->
    <!-- ========================= -->

    <main class="welcome">

        <div class="heart">
            ♡
        </div>

        <p class="small-text">
            I made something special for you...
        </p>

        <h1>
            For Someone
            <br>
            <span>Very Special</span> ✨
        </h1>

        <p class="subtitle">
            There's a little surprise waiting for you.
        </p>


        <!-- COUNTDOWN -->

        <div class="countdown" id="countdown">

            <div>
                <span id="days">00</span>
                <small>Days</small>
            </div>

            <div>
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div>
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div>
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>

        </div>


        <!-- OPEN BUTTON -->

        <button onclick="openSurprise()">
            Open Your Surprise 💌
        </button>

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
